name = "requestscope-api"
main = "src/index.ts"
compatibility_date = "2026-07-23"
# Observe public Worker routes instead of bypassing them to the underlying origin.
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

[vars]
# Production browser allowlist only. Local `wrangler dev` serving web/ from a
# separate origin should pass ALLOWED_ORIGINS including localhost via --var
# or the [env.dev] block below — never ship loopback origins to production.
ALLOWED_ORIGINS = "https://requestscope.illek.ie"
REPORT_RETENTION_DAYS = "14"
DAILY_SCAN_LIMIT = "15"
# Intentionally open MCP/url-risk for testing; keep this close to the anonymous
# UI scan limit so agents cannot cheaply run bulk traces. Mapped traces cost 2.
MCP_DAILY_LIMIT = "25"
REPORT_DAILY_LIMIT = "120"
WEB_RISK_MONTHLY_LIMIT = "90000"
PHISHTANK_DAILY_LIMIT = "100"
PHISHTANK_KEYLESS_ENABLED = "true"
CLOUDFLARE_FAMILY_DNS_ENABLED = "true"
CLOUDFLARE_FAMILY_DNS_DAILY_LIMIT = "5000"

[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "requestscope"
database_id = "582af539-f646-4aa8-b315-64c6425314ed"

[observability]
enabled = true
# 10% is enough for operational traces without retaining every request.
head_sampling_rate = 0.1

[assets]
directory = "../web"
binding = "ASSETS"
run_worker_first = ["/api/*", "/mcp", "/mcp/*"]

[[routes]]
pattern = "requestscope.illek.ie/*"
zone_name = "illek.ie"
